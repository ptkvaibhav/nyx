<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="500" y1="0" x2="700" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- Abstract data flow lines -->
  <path d="M0 150 Q 300 50, 600 150 T 1200 150" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M0 200 Q 300 250, 600 150 T 1200 100" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Glowing central node -->
  <g filter="url(#glow)">
    <circle cx="600" cy="150" r="45" fill="url(#accent)" fill-opacity="0.1"/>
    <circle cx="600" cy="150" r="30" fill="url(#accent)" fill-opacity="0.2"/>
    <path d="M600 110L635 150L600 190L565 150L600 110Z" fill="url(#accent)"/>
  </g>

  <!-- Typography -->
  <text x="600" y="240" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="42" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.1em">NYX</text>
  <text x="600" y="270" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3em">TRUE AI INTELLIGENCE &amp; ORGANIZATION</text>

  <!-- Orbital nodes -->
  <circle cx="450" cy="80" r="4" fill="#38bdf8"/>
  <line x1="450" y1="80" x2="600" y2="150" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
  
  <circle cx="750" cy="220" r="4" fill="#818cf8"/>
  <line x1="750" y1="220" x2="600" y2="150" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Tech tags -->
  <rect x="50" y="40" width="100" height="28" rx="6" fill="#1e293b" fill-opacity="0.5"/>
  <text x="100" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">Ollama</text>

  <rect x="1050" y="40" width="100" height="28" rx="6" fill="#1e293b" fill-opacity="0.5"/>
  <text x="1100" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8" text-anchor="middle">React Web</text>

  <rect x="50" y="230" width="120" height="28" rx="6" fill="#1e293b" fill-opacity="0.5"/>
  <text x="110" y="248" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a78bfa" text-anchor="middle">Content AI</text>
</svg>